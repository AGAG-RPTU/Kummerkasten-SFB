<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Conversation · Kummerkasten</title>
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/page-conversation.js"></script>
</head>
<body>
<header class="site"><div class="inner">
  <div class="brand">
    <a href="https://www.computeralgebra.de/sfb/"><img src="img/trr195-logo.png" alt="SFB-TRR 195" width="82" height="40"></a>
    <a href="./" data-i18n="site.short"></a>
  </div>
  <nav>
    <a href="./" data-i18n="nav.home"></a>
    <a href="write" data-i18n="nav.write"></a>
    <a href="conversation" data-i18n="nav.open" aria-current="page"></a>
    <button id="lang-toggle" class="link" type="button" data-i18n="lang.other"></button>
  </nav>
</div></header>
<main>
<h1 data-i18n="conv.title"></h1>

<form id="unlock" class="card" autocomplete="off">
  <label for="codeword" data-i18n="conv.codeword"></label>
  <input id="codeword" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">
  <label class="check"><input id="show-codeword" type="checkbox"> <span data-i18n="conv.show"></span></label>
  <p class="hint" data-i18n="conv.hint"></p>
  <div id="feedback" class="feedback" aria-live="polite"></div>
  <div class="actions"><button type="submit" data-i18n="conv.open"></button></div>
  <p id="unlock-status" class="status" hidden></p>
</form>

<section id="conversation" hidden>
  <div id="thread" class="thread"></div>
  <p id="thread-note" class="note" hidden></p>
  <form id="reply" class="card" autocomplete="off">
    <label for="reply-body" data-i18n="conv.reply"></label>
    <textarea id="reply-body" maxlength="20000" required></textarea>
    <div class="actions">
      <button type="submit" data-i18n="conv.send"></button>
      <button id="lock" type="button" class="secondary" data-i18n="conv.lock"></button>
      <button id="delete" type="button" class="danger" data-i18n="conv.delete"></button>
    </div>
    <p id="reply-status" class="status" hidden></p>
  </form>
</section>
</main>
<footer class="site">
  <a id="source-link" data-i18n="footer.source"></a>
  <a id="version" hidden></a>
  <a id="security-link" data-i18n="footer.security"></a>
  <a href="imprint" data-i18n="footer.imprint"></a>
  <a href="privacy" data-i18n="footer.privacy"></a>
  <a href="staff" data-i18n="footer.staff"></a>
</footer>
</body>
</html>
