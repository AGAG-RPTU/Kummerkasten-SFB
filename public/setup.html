<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Key setup · Kummerkasten</title>
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/page-setup.js"></script>
</head>
<body>
<header class="site"><div class="inner">
  <div class="brand">
    <a href="https://www.computeralgebra.de/sfb/"><img src="img/trr195-logo.png" alt="SFB-TRR 195" width="82" height="40"></a>
    <a href="./" data-i18n="site.short"></a>
  </div>
  <nav>
    <a href="./" data-i18n="nav.home"></a>
    <a href="write" data-i18n="nav.write"></a>
    <a href="conversation" data-i18n="nav.open"></a>
    <button id="lang-toggle" class="link" type="button" data-i18n="lang.other"></button>
  </nav>
</div></header>
<main>
<h1 data-i18n="setup.title"></h1>
<p data-i18n="setup.intro"></p>
<p class="hint" data-i18n="setup.rotate"></p>

<form id="form" class="card" autocomplete="off">
  <label for="staff-id" data-i18n="setup.id"></label>
  <input id="staff-id" type="text" autocapitalize="off" spellcheck="false" required>
  <label for="staff-name" data-i18n="setup.name"></label>
  <input id="staff-name" type="text" required>
  <label for="staff-email" data-i18n="setup.email"></label>
  <input id="staff-email" type="email" required aria-describedby="staff-email-hint">
  <p id="staff-email-hint" class="hint" data-i18n="setup.emailHint"></p>
  <div class="actions"><button id="generate" type="button" class="secondary" data-i18n="setup.generate"></button></div>

  <div id="passphrase-box" hidden>
    <p data-i18n="setup.passphrase"></p>
    <p id="passphrase" class="phrase"></p>
    <p class="hint" data-i18n="words.format"></p>
    <div class="actions"><button id="copy" type="button" class="secondary" data-i18n="setup.copy"></button></div>
    <label for="retype" data-i18n="setup.retype"></label>
    <input id="retype" type="text" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div id="feedback" class="feedback" aria-live="polite"></div>
    <div class="actions"><button type="submit" data-i18n="setup.create"></button></div>
  </div>
  <p id="status" class="status" hidden></p>
</form>

<section id="result" class="card" hidden>
  <p data-i18n="setup.result"></p>
  <pre id="entry" class="output"></pre>
  <div class="actions"><button id="copy-entry" type="button" class="secondary" data-i18n="setup.copyEntry"></button></div>
  <p><span data-i18n="setup.fingerprint"></span>: <code id="fingerprint"></code></p>
</section>
</main>
<footer class="site">
  <a id="source-link" data-i18n="footer.source"></a>
  <a id="version" hidden></a>
  <a id="security-link" data-i18n="footer.security"></a>
  <a href="imprint" data-i18n="footer.imprint"></a>
  <a href="privacy" data-i18n="footer.privacy"></a>
  <a href="staff" data-i18n="footer.staff"></a>
</footer>
</body>
</html>
