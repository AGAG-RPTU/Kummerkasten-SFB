<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Trusted persons · Kummerkasten</title>
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/page-staff.js"></script>
</head>
<body>
<header class="site"><div class="inner">
  <div class="brand">
    <a href="https://www.computeralgebra.de/sfb/"><img src="img/trr195-logo.png" alt="SFB-TRR 195" width="82" height="40"></a>
    <a href="./" data-i18n="site.short"></a>
  </div>
  <nav>
    <a href="./" data-i18n="nav.home"></a>
    <a href="write" data-i18n="nav.write"></a>
    <a href="conversation" data-i18n="nav.open"></a>
    <button id="lang-toggle" class="link" type="button" data-i18n="lang.other"></button>
  </nav>
</div></header>
<main>
<h1 data-i18n="staff.title"></h1>

<form id="unlock" class="card" autocomplete="off">
  <label for="who" data-i18n="staff.who"></label>
  <select id="who"></select>
  <label for="passphrase" data-i18n="staff.passphrase"></label>
  <input id="passphrase" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="current-password">
  <div id="feedback" class="feedback" aria-live="polite"></div>
  <div class="actions"><button type="submit" data-i18n="staff.unlock"></button></div>
  <p id="unlock-status" class="status" hidden></p>
</form>

<section id="inbox" hidden>
  <div class="session">
    <p id="whoami"></p>
    <button id="refresh" type="button" class="secondary" data-i18n="staff.refresh"></button>
    <button id="lock" type="button" class="secondary" data-i18n="staff.lock"></button>
  </div>
  <p id="inbox-status" class="status" hidden></p>
  <form id="rekey" class="card" autocomplete="off" hidden>
    <p id="rekey-notice"></p>
    <label for="old-passphrase" data-i18n="staff.rekey.label"></label>
    <input id="old-passphrase" type="password" autocapitalize="off" autocorrect="off" spellcheck="false" autocomplete="off">
    <div id="rekey-feedback" class="feedback" aria-live="polite"></div>
    <div class="actions"><button type="submit" data-i18n="staff.rekey.submit"></button></div>
    <p id="rekey-status" class="status" hidden></p>
  </form>
  <div id="convs" class="convs"></div>
</section>
</main>
<footer class="site">
  <a id="source-link" data-i18n="footer.source"></a>
  <a id="version" hidden></a>
  <a id="security-link" data-i18n="footer.security"></a>
  <a href="imprint" data-i18n="footer.imprint"></a>
  <a href="privacy" data-i18n="footer.privacy"></a>
  <a href="staff" data-i18n="footer.staff"></a>
</footer>
</body>
</html>
