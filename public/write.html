<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Write · Kummerkasten</title>
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/page-write.js"></script>
</head>
<body>
<header class="site"><div class="inner">
  <a class="brand" href="index.html">
    <img src="img/trr195-logo.png" alt="SFB TRR 195" width="82" height="40">
    <span data-i18n="site.short"></span>
  </a>
  <nav>
    <a href="index.html" data-i18n="nav.home"></a>
    <a href="write.html" data-i18n="nav.write" aria-current="page"></a>
    <a href="conversation.html" data-i18n="nav.open"></a>
    <button id="lang-toggle" class="link" type="button" data-i18n="lang.other"></button>
  </nav>
</div></header>
<main>
<h1 data-i18n="write.title"></h1>

<form id="form" class="card" autocomplete="off">
  <label for="password" data-i18n="write.password"></label>
  <input id="password" type="password" required autocomplete="off">

  <label for="category" data-i18n="write.category"></label>
  <select id="category">
    <option value="problem" data-i18n="cat.problem"></option>
    <option value="feedback" data-i18n="cat.feedback"></option>
    <option value="question" data-i18n="cat.question"></option>
    <option value="other" data-i18n="cat.other"></option>
  </select>

  <label for="subject" data-i18n="write.subject"></label>
  <input id="subject" type="text" maxlength="200">

  <label for="body" data-i18n="write.body"></label>
  <textarea id="body" maxlength="20000" required></textarea>

  <fieldset>
    <legend data-i18n="write.optional"></legend>
    <p class="hint" data-i18n="write.optionalHint"></p>
    <label for="name" data-i18n="write.name"></label>
    <input id="name" type="text" maxlength="200">
    <label for="contact" data-i18n="write.contact"></label>
    <input id="contact" type="text" maxlength="200">
  </fieldset>

  <div class="actions"><button id="send" type="submit" data-i18n="write.send"></button></div>
  <p id="status" class="status" hidden></p>
</form>

<section id="done" class="card" hidden>
  <h2 data-i18n="done.title"></h2>
  <ol id="codeword" class="codeword"></ol>
  <p class="warn" data-i18n="done.warn"></p>
  <div class="actions">
    <button id="copy" type="button" class="secondary" data-i18n="done.copy"></button>
    <button id="download" type="button" class="secondary" data-i18n="done.download"></button>
  </div>
  <label><input id="saved" type="checkbox"> <span data-i18n="done.confirm"></span></label>
  <div class="actions"><a id="next" class="button" href="conversation.html" hidden data-i18n="done.next"></a></div>
</section>
</main>
<footer class="site">
  <a id="source-link" data-i18n="footer.source"></a>
  <span id="version"></span>
  <a href="staff.html" data-i18n="footer.staff"></a>
</footer>
</body>
</html>
